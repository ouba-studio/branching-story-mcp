name: Publish to Official MCP Registry

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar -xz mcp-publisher
          chmod +x ./mcp-publisher
          ./mcp-publisher --version
      - name: Authenticate via GitHub OIDC and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
